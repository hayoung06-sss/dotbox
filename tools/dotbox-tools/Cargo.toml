[package]
name = "dotbox-tools"
description = "DotBox 호스트 개발 도구 라이브러리 (프로젝트 생성, 환경 점검, 빌드, 플래시)"
version.workspace = true
edition.workspace = true
publish = false

[dependencies]
dotbox-core.workspace = true
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
serialport = { version = "4.10.1", default-features = false }
sha2 = "0.11.1"
toml = "1.2.1"

[dev-dependencies]
tempfile = "3.27.0"
