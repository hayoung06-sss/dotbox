[workspace]
resolver = "3"
members = ["crates/*", "examples/*", "tools/dotbox-tools", "tools/dotbox-cli"]
exclude = ["platform/dotbox-esp"]

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
dotbox-core = { path = "crates/dotbox-core" }
dotbox-sim = { path = "crates/dotbox-sim" }
dotbox-tools = { path = "tools/dotbox-tools" }
